<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: linear-gradient(135deg, #042f2e 0%, #0d4f4a 40%, #115e59 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff; overflow: hidden;
  }
  .flag { font-size: 36px; margin-bottom: 8px; }
  .icon { font-size: 56px; margin-bottom: 12px; }
  .title { font-size: 72px; font-weight: 800; letter-spacing: -2px; }
  .title span { color: #fbbf24; }
  .tagline { font-size: 28px; color: #99f6e4; margin-top: 12px; }
  .features { display: flex; gap: 24px; margin-top: 32px; }
  .feature { background: rgba(251,191,36,0.15); color: #fbbf24; padding: 10px 24px; border-radius: 20px; font-size: 18px; font-weight: 600; }
  .badge { background: rgba(255,255,255,0.1); color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 18px; margin-top: 24px; }
</style>
</head>
<body>
  <div class="flag">🇨🇭</div>
  <div class="icon">🔁</div>
  <div class="title">Swap<span>Mart</span></div>
  <div class="tagline">Trade. Swap. Save. Switzerland's Fairest Marketplace.</div>
  <div class="features">
    <div class="feature">3% Fees</div>
    <div class="feature">Barter System</div>
    <div class="feature">Swap + Cash</div>
  </div>
  <div class="badge">Only 3% commission vs 8-12% elsewhere</div>
</body>
</html>
