services:
  app:
    container_name: stz-swapmart-app
    build: .
    image: stz-swapmart:latest
    ports:
      - "0.0.0.0:4003:4003"
    environment:
      NODE_ENV: production
      PORT: 4003
      DATABASE_URL: postgresql://swapmart_app:${SWAPMART_DB_PASSWORD}@stz-shared-db:5432/stz_swapmart
      REDIS_URL: redis://:${REDIS_PASSWORD}@stz-shared-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - stz-swapmart-uploads:/app/data/uploads
    networks:
      - stz-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      stz.project: "stuzzicadenti-ag"
      stz.service: "swapmart"

volumes:
  stz-swapmart-uploads:
    name: stz-swapmart-uploads

networks:
  stz-net:
    external: true
