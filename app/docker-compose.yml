version: "3.8"
services:
  app:
    container_name: stz-swapmart-app
    build: .
    image: stz-swapmart:latest
    ports:
      - "0.0.0.0:4003:4003"
    environment:
      NODE_ENV: production
      PORT: 4003
      DATABASE_URL: postgresql://swapmart_app:swapmart_pass@stz-shared-db:5432/stz_swapmart
      REDIS_URL: redis://stz-shared-redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - stz-swapmart-uploads:/app/data/uploads
    networks:
      - stz-net
    restart: unless-stopped
    labels:
      stz.project: "stuzzicadenti-ag"
      stz.service: "swapmart"

volumes:
  stz-swapmart-uploads:
    name: stz-swapmart-uploads

networks:
  stz-net:
    external: true
